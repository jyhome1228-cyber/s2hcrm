<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#101114"/><meta name="description" content="S2H 셀러 및 공구 운영 관리 시스템"/><title>S2H | Seller Operations</title><link rel="stylesheet" href="./styles.css"/></head>
<body><div id="root">
<section id="login" class="login"><div class="login-box"><div class="login-brand"><img src="./assets/s2h-mark.svg" alt="S2H"/><span>S2H CORPORATION</span></div><span class="eyebrow">SELLER OPERATIONS</span><h1>운영의 모든 흐름을<br/>한 곳에서.</h1><p>승인된 S2H 팀원 계정으로 로그인하세요.</p><form id="login-form"><label>이메일<input id="email" type="email" autocomplete="username" required placeholder="team@s2hcorp.co.kr"/></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required placeholder="비밀번호"/></label><button class="primary" type="submit">로그인</button><div id="login-error" class="error" role="alert"></div></form></div></section>
<div id="app" class="app hidden"><aside class="sidebar"><div class="brand brand-logo"><img src="./assets/s2h-mark.svg" alt="S2H"/><span class="brand-sub">SELLER INTELLIGENCE</span></div><div class="nav"><div class="nav-section">WORKSPACE</div><button data-page="dashboard" class="nav-link active">◫ <span>대시보드</span></button><button data-page="sellers" class="nav-link">◉ <span>셀러 관리</span></button><button data-page="schedule" class="nav-link">▦ <span>공구 일정</span></button><button data-page="reminders" class="nav-link">◎ <span>리마인드</span></button><button data-page="activity" class="nav-link">≡ <span>활동 기록</span></button></div><div class="sidebar-bottom">S2H CORPORATION<br/><small>Internal Workspace · v0.1</small></div></aside>
<main class="main"><header class="topbar"><div id="breadcrumb">Workspace / Dashboard</div><div class="top-right"><span id="today"></span><span class="avatar">S</span><span id="whoami"></span><button id="logout" class="text-button">로그아웃</button></div></header><section class="content"><div class="heading"><div><span class="eyebrow" id="section-kicker">OVERVIEW</span><h1 id="page-title">Dashboard</h1><p id="page-caption">오늘 필요한 업무부터 확인하세요.</p></div><button id="add-button" class="primary">+ 셀러 등록</button></div><div id="page-body"></div></section></main></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-panel"><div class="modal-head"><h2 id="modal-title"></h2><button id="close-modal" aria-label="닫기" class="text-button">✕</button></div><form id="modal-form"><div id="modal-fields"></div><div class="modal-actions"><button type="button" id="cancel-modal" class="secondary">취소</button><button type="submit" class="primary">저장</button></div></form></div></div>
<div id="toast" class="toast hidden" role="status"></div></div><script type="module" src="./app.js"></script></body></html>
