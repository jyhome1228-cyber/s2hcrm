<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#0089b3"/><meta name="description" content="S2H 셀러 및 공구 운영 관리 시스템"/><title>S2H | Seller Operations</title><link rel="icon" type="image/svg+xml" href="./assets/favicon.svg?v=s2h-original-logo-2"/><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"/><link rel="stylesheet" href="./styles.css?v=20261124-maintenance-calendarfix-8"/><link rel="stylesheet" href="./crm-ui.css?v=20261127-prep-align-fix-3"/></head>
<body><div id="root">
<section id="maintenance" class="maintenance-screen" role="dialog" aria-modal="true" aria-labelledby="maintenance-title">
  <div class="maintenance-content">
    <img class="maintenance-logo" src="./assets/s2h-mark.svg" alt="S2H CORPORATION"/>
    <h1 id="maintenance-title">서비스 업데이트 중입니다.</h1>
    <p>보다 안정적인 서비스를 위해 S2H CRM을 점검하고 있습니다.<br/>점검 중에는 일반 사용자 이용이 제한됩니다.</p>
    <button id="maintenance-admin-login" type="button">관리자 로그인</button>
  </div>
</section>
<section id="login" class="login hidden">
  <div class="login-box">
    <img class="login-center-logo" src="./assets/s2h-mark.svg" alt="S2H CORPORATION"/>
    <h1 class="login-screen-reader-title">S2H 로그인</h1>
    <form id="login-form">
      <label for="email">이메일
        <input id="email" type="email" autocomplete="username" inputmode="email" required placeholder="이메일을 입력해 주세요"/>
      </label>
      <label for="password">비밀번호
        <span class="password-field">
          <input id="password" type="password" autocomplete="current-password" required placeholder="비밀번호를 입력해 주세요"/>
          <button id="toggle-password" type="button" class="password-toggle" aria-label="비밀번호 표시" aria-pressed="false" title="비밀번호 표시"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </span>
      </label>
      <button class="primary login-submit" type="submit">로그인</button>
      <div id="login-error" class="error" role="alert"></div>
      <button type="button" id="preview-button" class="preview-button hidden">대시보드 미리보기</button>
      <p class="preview-hint hidden" id="preview-hint">예시 데이터만 확인할 수 있습니다.</p>
    </form>
  </div>
</section>

svg><span>리마인드</span></button><button type="button" data-page="activity" class="nav-link"><svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r=".8"/><circle cx="3.5" cy="12" r=".8"/><circle cx="3.5" cy="18" r=".8"/></svg><span>활동 기록</span></button></div><div class="nav-group"><div class="nav-section">데이터 관리</div><button type="button" data-page="products" class="nav-link"><svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16M9 4v16"/></svg><span>상품 관리</span></button><button type="button" data-page="import" class="nav-link hidden"><svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 7v9m-4-4 4 4 4-4M8 20h8"/></svg><span>백업</span></button></div></nav><div class="sidebar-bottom">S2H CORPORATION</div></aside>
<main class="main"><header class="topbar"><div class="topbar-left"><span class="topbar-home">S2H CRM</span><span class="topbar-divider" aria-hidden="true"></span><span id="breadcrumb-page">대시보드</span></div><span id="demo-banner" class="demo-banner hidden">DEMO · 예시 데이터 · 저장 불가</span><div class="top-right"><div class="work-alert-wrap">

</div></div><button type="button" id="global-seller-search" aria-label="셀러 검색"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.5"/><path d="m16 16 5 5"/></svg><span>셀러 검색</span></button><span id="today"></span><span class="avatar">S</span><span id="whoami"></span><button id="logout" class="text-button" type="button">로그아웃</button></div></header><section class="content"><div class="heading"><div class="page-heading-copy"><h1 id="page-title">대시보드</h1><p id="dashboard-heading-date" class="dashboard-heading-date hidden"></p></div><div class="page-heading-actions"><div id="dashboard-heading-actions" class="dashboard-heading-actions hidden"><button type="button" id="dashboard-quick-seller" class="secondary">셀러 등록</button><button type="button" id="dashboard-quick-activity" class="secondary">연락 기록</button></div><button type="button" id="add-button" class="primary">+ 셀러 등록</button></div></div><div id="page-body"></div></section></main></div>

<div id="seller-detail-modal" class="seller-detail-modal hidden" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="seller-detail-modal-title">
 <div class="seller-detail-dialog">
  <div class="seller-detail-dialog-head"><div><span class="seller-profile-eyebrow">S2H SELLER CRM</span><h2 id="seller-detail-modal-title">셀러 상세정보</h2></div><button type="button" id="seller-detail-modal-close" class="seller-detail-close" aria-label="셀러 상세 닫기">✕</button></div>

 </div>
</div>
